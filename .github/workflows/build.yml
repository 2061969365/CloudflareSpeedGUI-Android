name: build

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-cfst:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'

      - name: Build cfst android binaries
        run: bash scripts/build-cfst-android.sh

      - name: Commit cfst android binaries
        run: |
          set -euo pipefail
          git config user.name "cfst-bot"
          git config user.email "cfst-bot@users.noreply.github.com"
          git add android/app/src/main/jniLibs
          if git diff --cached --quiet; then
            echo "Nothing to commit - jniLibs already up to date"
          else
            git commit -m "chore: build cfst android binaries"
            git push origin main
          fi

  build:
    runs-on: ubuntu-latest
    needs: build-cfst
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - uses: android-actions/setup-android@v3
        with:
          packages: platforms;android-36 build-tools;36.0.0

      - name: Engine tests
        working-directory: engine
        run: ./gradlew test

      - name: Ensure signing key
        working-directory: android
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > ./cfst-release.jks
            printf 'storeFile=../cfst-release.jks\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' "$KEYSTORE_PASSWORD" "$KEY_ALIAS" "$KEY_PASSWORD" > signing.properties
          else
            keytool -genkeypair -v -keystore ./cfst-release.jks -storepass cfst-cfst-cfst -alias cfst -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=CloudflareSpeedGUI, OU=Dev, O=cfst, L=City, ST=State, C=CN"
            printf 'storeFile=../cfst-release.jks\nstorePassword=cfst-cfst-cfst\nkeyAlias=cfst\nkeyPassword=cfst-cfst-cfst\n' > signing.properties
          fi

      - name: Android build
        working-directory: android
        run: ./gradlew :app:assembleRelease

      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
